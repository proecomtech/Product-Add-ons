# Theme Check configuration for the Product add-ons theme app extension.

extends: theme-app-extension:recommended

AssetSizeJavaScript:
  enabled: true
  # The default is 10 KB measured on the raw file. product-addons.js is ~22 KB
  # raw and ~6.7 KB gzipped, and Shopify serves theme assets gzipped — so the
  # bytes a shopper actually downloads are comfortably inside the intended
  # budget. Roughly a third of the raw size is the comments explaining why the
  # cart interception works the way it does, which is worth keeping.
  #
  # 24 KB, not "off": it still fails if the file grows materially. If it does,
  # the fix is to split the cart reconciliation out rather than to raise this
  # again.
  threshold_in_bytes: 24576

AssetSizeCSS:
  enabled: true
  threshold_in_bytes: 10240
