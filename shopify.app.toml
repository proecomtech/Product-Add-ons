# Product Add-ons — Shopify app
# Configuration reference: https://shopify.dev/docs/apps/tools/cli/configuration
#
# `client_id` is filled in by `shopify app config link`, which connects this
# folder to an app in your Partner dashboard. Do not hand-write it.
client_id = "ca36bda0a417b97674b1ee10e3c5476b"

name = "Product Add-ons"
handle = "product-addons"
embedded = true

# Public host the app is served from. `shopify app dev` rewrites this to the
# tunnel URL while `[build].automatically_update_urls_on_dev` is true, so the
# value below is the production one and has to be put back (and deployed)
# after a dev session.
application_url = "https://add-ons.proecomtech.com"

[build]
automatically_update_urls_on_dev = true

[access_scopes]
# read_products  — the admin's product/collection pickers and the targeting
#                  rules that decide which products a group applies to.
# write_products — paid add-ons are charged by adding a real variant to the
#                  cart, so each one gets its own hidden product holding a
#                  single variant priced to match. See
#                  app/models/addon-product.server.ts.
# read_publications, write_publications — /cart/add.js refuses a variant whose
#                  product is not published to the Online Store, so every
#                  generated add-on product must be published to that channel.
scopes = "read_products,write_products,read_publications,write_publications"

[auth]
# Both paths land on the `auth.$` splat route (app/routes/auth.$.tsx).
# Rewritten alongside `application_url` by `shopify app dev`.
redirect_urls = [
  "https://add-ons.proecomtech.com/auth/callback",
  "https://add-ons.proecomtech.com/auth/shopify/callback",
]

[webhooks]
api_version = "2025-01"

  # Handled by: app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Handled by: app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  # The three privacy webhooks every public app must answer, whatever it
  # stores. They need their own subscription block because `compliance_topics`
  # and `topics` cannot share one. `shopify app deploy` is what registers
  # these — the automated review check reads the deployed app version, not this
  # file, so an undeployed change here still fails the check.
  # Handled by: app/routes/webhooks.compliance.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]

[app_proxy]
# The storefront block fetches its add-on config from
#   /apps/product-addons/config.json?product=<id>
# Shopify forwards the path AFTER the subpath, so that arrives at the app as
#   {url}/config.json?product=<id>
# A proxy (rather than a metafield) keeps the database the single source of
# truth: editing a group in the admin takes effect immediately, with no
# product resync. Requests are signature-verified by
# `authenticate.public.appProxy` in app/routes/proxy.config[.]json.tsx.
#
# NOTE: unlike `application_url`, this is NOT rewritten for you by
# `shopify app dev` — the URL below has to be the app's real host with `/proxy`
# on the end (your dev tunnel while developing, your deployed host in
# production), and a `shopify app deploy` is what publishes a change to it. If
# add-ons never load on the storefront, this is the first thing to check.
url = "https://add-ons.proecomtech.com/proxy"
subpath = "product-addons"
prefix = "apps"
